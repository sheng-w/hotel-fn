<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国内希尔顿 · 万豪 Free Night 兑换地图</title>
<style>
:root{
  --surface-0:#f7f7f5;
  --surface-1:#ecebe6;
  --surface-2:#ffffff;
  --border:rgba(0,0,0,0.12);
  --border-strong:rgba(0,0,0,0.24);
  --text-primary:#1a1a1a;
  --text-secondary:#5f5e5a;
  --text-muted:#888780;
  --text-accent:#0C447C;
  --bg-accent:#E6F1FB;
  --border-accent:#378ADD;
  --radius:8px;
}
@media (prefers-color-scheme:dark){
  :root{
    --surface-0:#1a1a1a;
    --surface-1:#2a2a2a;
    --surface-2:#333333;
    --border:rgba(255,255,255,0.12);
    --border-strong:rgba(255,255,255,0.24);
    --text-primary:#f0f0ee;
    --text-secondary:#b4b2a9;
    --text-muted:#888780;
    --text-accent:#85B7EB;
    --bg-accent:#0C447C;
    --border-accent:#378ADD;
  }
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:24px 16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--surface-0);
  color:var(--text-primary);
  line-height:1.55;
}
.container{max-width:900px;margin:0 auto}
h1{font-size:22px;font-weight:500;margin:0 0 4px;letter-spacing:-0.01em}
.subtitle{font-size:13px;color:var(--text-secondary);margin:0 0 20px}
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;align-items:center}
.chip{padding:5px 11px;border-radius:999px;border:0.5px solid var(--border-strong);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer;transition:all 0.15s}
.chip:hover{background:var(--surface-1)}
.chip.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.grp-label{font-size:12px;color:var(--text-secondary);margin-right:4px}
.map-box{position:relative;width:100%;height:600px;border-radius:12px;overflow:hidden;border:0.5px solid var(--border);background:var(--surface-1);touch-action:none;margin-top:12px}
#svgmap{width:100%;height:100%;user-select:none;display:block}
.pan-layer{cursor:grab}
.pan-layer.grab{cursor:grabbing}
.province{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:0.5;stroke-linejoin:round;pointer-events:none}
.marker{cursor:pointer;stroke:#fff;stroke-width:1.2;transition:stroke-width 0.15s}
.marker:hover{stroke-width:2.5}
.zoom-ctrl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:4px;z-index:5}
.zbtn{width:34px;height:34px;border-radius:6px;border:0.5px solid var(--border-strong);background:var(--surface-2);color:var(--text-primary);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0}
.zbtn:hover{background:var(--surface-1)}
.legend{position:absolute;bottom:10px;left:10px;background:var(--surface-2);border:0.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:11px;color:var(--text-primary);z-index:5;max-width:220px}
.legend-title{font-weight:500;margin:0 0 3px;font-size:12px}
.legend-ramp{display:flex;gap:2px;margin:2px 0 8px;align-items:center}
.legend-ramp span{width:16px;height:11px;display:inline-block}
.legend-ramp .lo,.legend-ramp .hi{font-size:10px;color:var(--text-secondary);margin:0 4px}
.popup{position:absolute;background:var(--surface-2);border:0.5px solid var(--border);border-radius:10px;padding:14px 16px;font-size:13px;min-width:260px;max-width:300px;z-index:10;color:var(--text-primary);box-shadow:0 8px 24px rgba(0,0,0,0.15),0 2px 6px rgba(0,0,0,0.1);display:none}
.popup.on{display:block}
.pop-title{font-size:15px;font-weight:500;margin:0 0 2px}
.pop-city{font-size:12px;color:var(--text-secondary);margin:0 0 10px}
.pop-row{display:flex;justify-content:space-between;gap:8px;margin:4px 0;font-size:12px}
.pop-row .lbl{color:var(--text-secondary)}
.pop-stars{color:#EF9F27;letter-spacing:1px}
.pop-note{margin-top:10px;padding-top:10px;border-top:0.5px solid var(--border);font-size:12px;color:var(--text-secondary);line-height:1.6}
.pop-badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;margin-top:2px}
.pop-close{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:20px;padding:2px 8px;line-height:1}
.pop-close:hover{color:var(--text-primary)}
.pop-links{margin-top:10px;padding-top:10px;border-top:0.5px solid var(--border)}
.pop-links-title{font-size:11px;color:var(--text-muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:0.05em}
.pop-link{display:block;font-size:12px;color:var(--text-accent);text-decoration:none;padding:6px 0;line-height:1.45;border-bottom:0.5px dashed var(--border)}
.pop-link:last-child{border-bottom:none}
.pop-link:hover{background:var(--surface-1);margin:0 -6px;padding:6px}
.pop-link-src{color:var(--text-muted);font-size:11px;display:block;margin-top:2px}
.footer{margin-top:16px;font-size:12px;color:var(--text-muted);text-align:center;line-height:1.6}
.footer a{color:var(--text-accent);text-decoration:none}
</style>
</head>
<body>
<div class="container">
  <h1>国内希尔顿 · 万豪 Free Night 兑换地图</h1>
  <p class="subtitle">红色圆点 · 希尔顿系  ·  蓝色三角 · 万豪系  ·  颜色越深 · 推荐兑换指数越高  ·  点击标记查看详情与体验分享</p>
  <div class="filter-bar">
    <span class="grp-label">集团</span>
    <button class="chip on" data-g="all">全部</button>
    <button class="chip" data-g="hilton">希尔顿 ●</button>
    <button class="chip" data-g="marriott">万豪 ▲</button>

    <span class="grp-label">推荐度</span>
    <button class="chip on" data-s="all">全部</button>
    <button class="chip" data-s="5">仅 5 星</button>
    <button class="chip" data-s="4">4 星及以上</button>
  </div>
  <div class="map-box" id="mapbox">
    <svg id="svgmap" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
      <g id="pan" class="pan-layer">
        <rect id="panbg" x="-2000" y="-2000" width="6000" height="6000" fill="transparent"></rect>
        <g id="maplayer"></g>
        <g id="markerlayer"></g>
      </g>
    </svg>
    <div class="zoom-ctrl">
      <button class="zbtn" id="zin" aria-label="放大">+</button>
      <button class="zbtn" id="zout" aria-label="缩小">−</button>
      <button class="zbtn" id="zreset" aria-label="重置" style="font-size:11px">重置</button>
    </div>
    <div class="legend">
      <div class="legend-title">希尔顿 ● 圆</div>
      <div class="legend-ramp"><span class="lo">3★</span><span style="background:#FCA5A5"></span><span style="background:#EF4444"></span><span style="background:#7F1D1D"></span><span class="hi">5★</span></div>
      <div class="legend-title">万豪 ▲ 三角</div>
      <div class="legend-ramp"><span class="lo">3★</span><span style="background:#93C5FD"></span><span style="background:#3B82F6"></span><span style="background:#1E3A8A"></span><span class="hi">5★</span></div>
      <div style="color:var(--text-secondary);margin-top:2px">大小与颜色同步 · 越大越推荐</div>
    </div>
    <div class="popup" id="popup"><button class="pop-close" id="popclose">×</button><div id="popcontent"></div></div>
  </div>
  <div class="footer">
    数据基于 2026 年会员社区常见共识 · 现金价随季节波动 · 兑换前请以希尔顿/万豪官方为准<br>
    体验分享链接来自 美国信用卡指南、抛因特达人、美卡 101、飞客茶馆 等社区

const hiltonRamp={3:"#FCA5A5",4:"#EF4444",5:"#7F1D1D"};
const marriottRamp={3:"#93C5FD",4:"#3B82F6",5:"#1E3A8A"};
function colorFor(h){return h.grp==="hilton"?(hiltonRamp[h.s]||hiltonRamp[4]):(marriottRamp[h.s]||marriottRamp[4])}
const NS="http://www.w3.org/2000/svg";
const svgEl=document.getElementById("svgmap");
const panEl=document.getElementById("pan");
const mapLayer=document.getElementById("maplayer");
const markerLayer=document.getElementById("markerlayer");

// Simple Mercator projection (no d3 needed)
const CENTER_LNG=104, CENTER_LAT=36;
const SCALE=700;
const CX=400, CY=290;
function mercator(lng, lat){
  const rad = lat * Math.PI/180;
  const centerRad = CENTER_LAT * Math.PI/180;
  const x = (lng - CENTER_LNG) * Math.PI/180 * SCALE + CX;
  const y = CY - (Math.log(Math.tan(Math.PI/4 + rad/2)) - Math.log(Math.tan(Math.PI/4 + centerRad/2))) * SCALE;
  return [x, y];
}

function drawMap(){
  mapLayer.innerHTML="";
  CHINA_GEOJSON.features.forEach(f=>{
    const g = f.geometry;
    let coords = g.coordinates;
    const isMulti = g.type === "MultiPolygon";
    const polygons = isMulti ? coords : [coords];
    polygons.forEach(poly=>{
      // Each poly = [outerRing, innerRing1, ...]
      let d = "";
      poly.forEach(ring=>{
        ring.forEach((pt, i)=>{
          const [x, y] = mercator(pt[0], pt[1]);
          d += (i===0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1);
        });
        d += "Z";
      });
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", d);
      p.setAttribute("class", "province");
      mapLayer.appendChild(p);
    });
  });
}

let curFilter={g:"all",s:"all"};
function stars(n){return "★".repeat(n)+"☆".repeat(5-n)}
function drawMarkers(){
  while(markerLayer.firstChild) markerLayer.removeChild(markerLayer.firstChild);
  HOTELS.forEach(h=>{
    if(curFilter.g!=="all"&&h.grp!==curFilter.g) return;
    if(curFilter.s==="5"&&h.s<5) return;
    if(curFilter.s==="4"&&h.s<4) return;
    const [x,y]=mercator(h.lng,h.lat);
    const color=colorFor(h);
    let el;
    if(h.grp==="hilton"){
      const size=4+h.s*1.3;
      el=document.createElementNS(NS,"circle");
      el.setAttribute("cx",x);
      el.setAttribute("cy",y);
      el.setAttribute("r",size);
    } else {
      const size=5+h.s*1.5;
      el=document.createElementNS(NS,"polygon");
      el.setAttribute("points",x+","+(y-size)+" "+(x-size*0.87)+","+(y+size*0.5)+" "+(x+size*0.87)+","+(y+size*0.5));
    }
    el.setAttribute("fill",color);
    el.setAttribute("class","marker");
    el.dataset.hi=HOTELS.indexOf(h);
    markerLayer.appendChild(el);
  });
}

const popup=document.getElementById("popup");
const popContent=document.getElementById("popcontent");
document.getElementById("popclose").addEventListener("click",e=>{e.stopPropagation();popup.classList.remove("on")});
function showPop(h,x,y){
  const color=colorFor(h);
  const linksHtml=(h.links&&h.links.length)?
    '<div class="pop-links"><p class="pop-links-title">体验分享</p>'+
    h.links.map(l=>'<a class="pop-link" href="'+l.u+'" target="_blank" rel="noopener">'+l.t+'<span class="pop-link-src">'+l.src+'</span></a>').join("")+
    '</div>':"";
  popContent.innerHTML=
    '<p class="pop-title">'+h.n+'</p>'+
    '<p class="pop-city">'+h.c+' · <span class="pop-badge" style="background:'+color+'22;color:'+color+'">'+h.brand+'</span></p>'+
    '<div class="pop-row"><span class="lbl">现金参考价</span><span>¥'+h.cash+'/晚</span></div>'+
    '<div class="pop-row"><span class="lbl">推荐兑换指数</span><span class="pop-stars">'+stars(h.s)+'</span></div>'+
    '<div class="pop-row"><span class="lbl">集团</span><span>'+(h.grp==="hilton"?"希尔顿":"万豪")+'</span></div>'+
    '<div class="pop-note">'+h.note+'</div>'+
    linksHtml;
  const box=document.getElementById("mapbox").getBoundingClientRect();
  const svgBox=svgEl.getBoundingClientRect();
  const vb=svgEl.viewBox.baseVal;
  const scaleX=svgBox.width/vb.width;
  const scaleY=svgBox.height/vb.height;
  const screenX=(x-vb.x)*scaleX;
  const screenY=(y-vb.y)*scaleY;
  popup.style.left="0px";popup.style.top="0px";
  popup.classList.add("on");
  const pw=popup.offsetWidth,ph=popup.offsetHeight;
  let px=screenX+15,py=screenY-10;
  if(px+pw>box.width-10) px=screenX-pw-15;
  if(py+ph>box.height-10) py=box.height-ph-10;
  if(py<10) py=10;
  if(px<10) px=10;
  popup.style.left=px+"px";
  popup.style.top=py+"px";
}

let downPt=null,didDrag=false;
markerLayer.addEventListener("pointerdown",e=>{
  if(e.target.classList&&e.target.classList.contains("marker")){
    downPt={x:e.clientX,y:e.clientY,el:e.target};
    didDrag=false;
  }
});
document.addEventListener("pointermove",e=>{
  if(downPt&&(Math.abs(e.clientX-downPt.x)>4||Math.abs(e.clientY-downPt.y)>4)) didDrag=true;
});
markerLayer.addEventListener("click",e=>{
  if(!e.target.classList||!e.target.classList.contains("marker")) return;
  if(didDrag){downPt=null;return;}
  e.stopPropagation();
  const idx=parseInt(e.target.dataset.hi,10);
  const h=HOTELS[idx];
  if(!h) return;
  const [x,y]=mercator(h.lng,h.lat);
  showPop(h,x,y);
  downPt=null;
});
document.querySelectorAll("[data-g]").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("[data-g]").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");curFilter.g=b.dataset.g;drawMarkers();popup.classList.remove("on");
}));
document.querySelectorAll("[data-s]").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("[data-s]").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");curFilter.s=b.dataset.s;drawMarkers();popup.classList.remove("on");
}));

let vb={x:0,y:0,w:800,h:600};
function applyVB(){svgEl.setAttribute("viewBox",vb.x+" "+vb.y+" "+vb.w+" "+vb.h);popup.classList.remove("on")}
document.getElementById("zin").addEventListener("click",()=>{const nw=vb.w*0.7,nh=vb.h*0.7;vb.x+=(vb.w-nw)/2;vb.y+=(vb.h-nh)/2;vb.w=nw;vb.h=nh;applyVB()});
document.getElementById("zout").addEventListener("click",()=>{const nw=vb.w/0.7,nh=vb.h/0.7;vb.x-=(nw-vb.w)/2;vb.y-=(nh-vb.h)/2;vb.w=nw;vb.h=nh;applyVB()});
document.getElementById("zreset").addEventListener("click",()=>{vb={x:0,y:0,w:800,h:600};applyVB()});
svgEl.addEventListener("wheel",e=>{e.preventDefault();const rect=svgEl.getBoundingClientRect();const mx=(e.clientX-rect.left)/rect.width*vb.w+vb.x;const my=(e.clientY-rect.top)/rect.height*vb.h+vb.y;const f=e.deltaY<0?0.82:1.22;vb.x=mx-(mx-vb.x)*f;vb.y=my-(my-vb.y)*f;vb.w=vb.w*f;vb.h=vb.h*f;applyVB()},{passive:false});
let drag=false,sx=0,sy=0,svx=0,svy=0;
svgEl.addEventListener("pointerdown",e=>{
  if(e.target.classList&&e.target.classList.contains("marker")) return;
  drag=true;sx=e.clientX;sy=e.clientY;svx=vb.x;svy=vb.y;
  panEl.classList.add("grab");
  svgEl.setPointerCapture(e.pointerId);
});
svgEl.addEventListener("pointermove",e=>{
  if(!drag)return;
  const rect=svgEl.getBoundingClientRect();
  const dx=(e.clientX-sx)/rect.width*vb.w;
  const dy=(e.clientY-sy)/rect.height*vb.h;
  vb.x=svx-dx;vb.y=svy-dy;applyVB();
});
svgEl.addEventListener("pointerup",()=>{drag=false;panEl.classList.remove("grab")});
svgEl.addEventListener("pointercancel",()=>{drag=false;panEl.classList.remove("grab")});

drawMap();
drawMarkers();
</script>
</body>
</html>
